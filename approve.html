<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Approve Job / อนุมัติงาน / 批准工程</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <div class="brand-bar" id="brand-bar"></div>

  <div class="app-header">
    <h1>🧾 Approve Contractor Job / อนุมัติงานผู้รับเหมา / 批准承包商工程</h1>
    <p>Review the job below and approve or reject it — no login required / ตรวจสอบรายละเอียดด้านล่างแล้วกดอนุมัติหรือปฏิเสธได้เลย ไม่ต้องล็อกอิน / 请查看以下工程详情并批准或拒绝，无需登录</p>
  </div>

  <section class="tab-panel">
    <div id="job-content" class="card">
      <div class="hint">Loading… / กำลังโหลด... / 加载中…</div>
    </div>
  </section>

</div>

<!-- ============ IMAGE LIGHTBOX ============ -->
<div class="lightbox-overlay" id="lightbox-modal" style="display:none;">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<div id="toast-container"></div>

<script type="module" src="js/approve-page.js"></script>
</body>
</html>
